services:
  php:
    build:
      context: .
      dockerfile: ./containers/php/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    container_name: photo-saas-php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      TZ: Asia/Tokyo
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - photo-saas-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: photo-saas-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - photo-saas-net

  nginx:
    image: nginx:1.29-bookworm
    container_name: photo-saas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./containers/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./containers/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./containers/nginx/certs:/etc/nginx/certs
    depends_on:
      - php
      - minio
    networks:
      photo-saas-net:
        aliases:
          - backend.local
          - frontend.local
          - storage.local

  node:
    build:
      context: .
      dockerfile: ./containers/node/Dockerfile
    container_name: photo-saas-node
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - ./containers/nginx/certs:/etc/nginx/certs:ro
    environment:
      TZ: Asia/Tokyo
      NODE_EXTRA_CA_CERTS: /etc/nginx/certs/photo-saas.local-ca-bundle.crt
    networks:
      - photo-saas-net

  postgresql:
    build:
      context: .
      dockerfile: ./containers/postgresql/Dockerfile
    container_name: photo-saas-postgresql
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    environment:
      TZ: Asia/Tokyo
      POSTGRES_DB: photo_saas
      POSTGRES_USER: photo_saas
      POSTGRES_PASSWORD: photo_saas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_saas -d photo_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photo-saas-net

  redis:
    image: redis:8.2-bookworm
    container_name: photo-saas-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photo-saas-net

  minio:
    image: minio/minio:latest
    container_name: photo-saas-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-password
      MINIO_API_CORS_ALLOW_ORIGIN: https://frontend.local
      MINIO_BROWSER_REDIRECT_URL: https://storage.local
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - photo-saas-net

  minio-init:
    image: minio/mc:latest
    container_name: photo-saas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >-
      -c 'mc alias set local http://minio:9000 minio minio-password
      && mc mb --ignore-existing local/photo-saas'
    networks:
      - photo-saas-net

volumes:
  postgresql-data:
  redis-data:
  minio-data:

networks:
  photo-saas-net:
    driver: bridge
