services:
  php:
    build:
      context: .
      dockerfile: ./containers/php/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    container_name: photo-saas-php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      TZ: Asia/Tokyo
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - photo-saas-net

  nginx:
    image: nginx:1.29-bookworm
    container_name: photo-saas-nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./containers/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - photo-saas-net

  node:
    build:
      context: .
      dockerfile: ./containers/node/Dockerfile
    container_name: photo-saas-node
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      TZ: Asia/Tokyo
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: development
    networks:
      - photo-saas-net

  postgresql:
    build:
      context: .
      dockerfile: ./containers/postgresql/Dockerfile
    container_name: photo-saas-postgresql
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    environment:
      TZ: Asia/Tokyo
      POSTGRES_DB: photo_saas
      POSTGRES_USER: photo_saas
      POSTGRES_PASSWORD: photo_saas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_saas -d photo_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photo-saas-net

  redis:
    image: redis:8.2-bookworm
    container_name: photo-saas-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photo-saas-net

volumes:
  postgresql-data:
  redis-data:

networks:
  photo-saas-net:
    driver: bridge
